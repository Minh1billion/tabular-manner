[project]
name = "tabular-manner"
version = "0.1.0"
description = "A low-code platform for designing data processing workflows using a graph-based model."
requires-python = ">=3.10"
dependencies = [
    "polars",
    "boto3",
    "numpy",
]

[project.scripts]
tm = "src.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "tqdm",
    "pathspec",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "scripts"
"main.py" = "main.py"