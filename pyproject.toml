[project]
name = "tabular-manner"
version = "0.1.0"
description = "A low-code platform for designing data processing workflows using a graph-based model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "polars",
    "boto3",
    "numpy",
]

[project.urls]
Repository = "https://github.com/Minh1billion/tabular-manner"

[project.scripts]
tm = "cli:main"

[dependency-groups]
dev = [
    "pytest",
    "tqdm",
    "pathspec",
    "twine>=7.0.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_manner"]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "scripts"
"cli.py" = "cli.py"
